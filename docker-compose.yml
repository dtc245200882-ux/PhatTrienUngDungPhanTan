services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "${MONGODB_HOST_PORT:?Set MONGODB_HOST_PORT in .env}:${MONGODB_CONTAINER_PORT:?Set MONGODB_CONTAINER_PORT in .env}"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - video_network

  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_HOST_PORT:?Set MINIO_API_HOST_PORT in .env}:${MINIO_API_CONTAINER_PORT:?Set MINIO_API_CONTAINER_PORT in .env}"
      - "${MINIO_CONSOLE_HOST_PORT:?Set MINIO_CONSOLE_HOST_PORT in .env}:${MINIO_CONSOLE_CONTAINER_PORT:?Set MINIO_CONSOLE_CONTAINER_PORT in .env}"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "${MINIO_HEALTH_URL:?Set MINIO_HEALTH_URL in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - video_network

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:?Set RABBITMQ_AMQP_HOST_PORT in .env}:${RABBITMQ_AMQP_CONTAINER_PORT:?Set RABBITMQ_AMQP_CONTAINER_PORT in .env}"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:?Set RABBITMQ_MANAGEMENT_HOST_PORT in .env}:${RABBITMQ_MANAGEMENT_CONTAINER_PORT:?Set RABBITMQ_MANAGEMENT_CONTAINER_PORT in .env}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - video_network

  video-api:
    build:
      context: .
      dockerfile: src/Video.API/Dockerfile
    image: video-api:local
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: ${VIDEO_API_CONTAINER_PORT:?Set VIDEO_API_CONTAINER_PORT in .env}
      MongoDB__ConnectionString: ${MONGODB_CONNECTION_STRING:?Set MONGODB_CONNECTION_STRING in .env}
      MongoDB__DatabaseName: VideoProcessingDb
      MongoDB__CollectionName: Videos
      MongoDB__JobsCollectionName: Jobs
      MinIO__Endpoint: ${MINIO_ENDPOINT:?Set MINIO_ENDPOINT in .env}
      MinIO__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MinIO__UseSSL: "false"
      MinIO__BucketName: videos
      RabbitMQ__Uri: ${RABBITMQ_URI:?Set RABBITMQ_URI in .env}
      RabbitMQ__QueueName: video-uploaded
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${VIDEO_API_HEALTH_URL:?Set VIDEO_API_HEALTH_URL in .env} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${VIDEO_API_HOST_PORT:?Set VIDEO_API_HOST_PORT in .env}:${VIDEO_API_CONTAINER_PORT:?Set VIDEO_API_CONTAINER_PORT in .env}"
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - video_network

  video-worker:
    build:
      context: .
      dockerfile: src/Video.Worker/Dockerfile
    image: video-worker:local
    restart: unless-stopped
    environment:
      MongoDB__ConnectionString: ${MONGODB_CONNECTION_STRING:?Set MONGODB_CONNECTION_STRING in .env}
      MongoDB__DatabaseName: VideoProcessingDb
      MongoDB__CollectionName: Videos
      MongoDB__JobsCollectionName: Jobs
      MinIO__Endpoint: ${MINIO_ENDPOINT:?Set MINIO_ENDPOINT in .env}
      MinIO__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MinIO__UseSSL: "false"
      MinIO__BucketName: videos
      RabbitMQ__Uri: ${RABBITMQ_URI:?Set RABBITMQ_URI in .env}
      RabbitMQ__QueueName: video-uploaded
      RabbitMQ__MaxRetries: 3
      RabbitMQ__RetryDelayMilliseconds: 5000
      Health__Scheme: ${WORKER_HEALTH_SCHEME:?Set WORKER_HEALTH_SCHEME in .env}
      Health__BindAddress: ${WORKER_HEALTH_BIND_ADDRESS:?Set WORKER_HEALTH_BIND_ADDRESS in .env}
      Health__Port: ${WORKER_HEALTH_PORT:?Set WORKER_HEALTH_PORT in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${WORKER_HEALTH_URL:?Set WORKER_HEALTH_URL in .env} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - video_network

  web-client:
    build:
      context: .
      dockerfile: src/Web.Client/Dockerfile
    image: web-client:local
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: ${WEB_CLIENT_CONTAINER_PORT:?Set WEB_CLIENT_CONTAINER_PORT in .env}
      VideoApi__BaseUrl: ${VIDEO_API_BASE_URL:?Set VIDEO_API_BASE_URL in .env}
    ports:
      - "${WEB_CLIENT_HOST_PORT:?Set WEB_CLIENT_HOST_PORT in .env}:${WEB_CLIENT_CONTAINER_PORT:?Set WEB_CLIENT_CONTAINER_PORT in .env}"
    depends_on:
      video-api:
        condition: service_healthy
    networks:
      - video_network

volumes:
  mongodb_data:
  minio_data:
  rabbitmq_data:

networks:
  video_network:
    driver: bridge